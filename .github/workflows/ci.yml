name: Desktop CI

on:
  push:
    branches: [stable, main]
  pull_request:
    branches: [stable, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debrand-audit:
    name: Debrand Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run debranding audit
        run: bash scripts/audit-debrand.sh

  rust-launcher:
    name: Rust Launcher Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src/rust/launcher

      - name: Run clippy on launcher
        env:
          RUSTFLAGS: '-D warnings'
          THREEMA_BUILD_FLAVOR: work-onprem
        run: cargo clippy --manifest-path apps/desktop/src/rust/launcher/Cargo.toml

  lint-build-test:
    name: Lint, Build & Mocha Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          targets: wasm32-unknown-unknown

      - name: Cache libthreema Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/libthreema-wasm/libs/libthreema

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.114

      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          sudo mkdir -p /usr/local/binaryen
          sudo tar -xzf /tmp/binaryen.tar.gz -C /usr/local/binaryen --strip-components=1
          rm /tmp/binaryen.tar.gz
          echo "/usr/local/binaryen/bin" >> "$GITHUB_PATH"
          /usr/local/binaryen/bin/wasm-opt --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Run lint
        run: pnpm run lint

      - name: Build conferencing
        run: pnpm run build:conferencing

      - name: Build desktop (work-onprem)
        run: pnpm run build:desktop:work-onprem

      - name: Run Mocha tests (work-onprem)
        run: pnpm run test:desktop:mocha:work-onprem

  dist-windows:
    name: Windows Dist (work-onprem)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [debrand-audit, lint-build-test]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python setuptools for node-gyp
        run: python -m pip install setuptools

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure node-gyp v12 for Visual Studio 2026 (v18)
        shell: pwsh
        run: |
          $ngDir = Join-Path $env:RUNNER_TEMP "node-gyp12"
          npm install --prefix $ngDir node-gyp@12
          $ngPkgDir = (Join-Path $ngDir "node_modules\node-gyp").Replace("\", "/")
          $ngBin = "$ngPkgDir/bin/node-gyp.js"
          $npxCmd = (Get-Command npx.cmd).Source
          $npxDir = Split-Path $npxCmd -Parent
          $npxReal = Join-Path $npxDir "npx-real.cmd"
          if (-not (Test-Path $npxReal)) {
            Move-Item -Path $npxCmd -Destination $npxReal
          }
          $wrapper = @"
          @echo off
          if "%~1"=="node-gyp-build" (
            node "$ngBin" rebuild
            exit /b %ERRORLEVEL%
          )
          call "%~dp0npx-real.cmd" %*
          "@
          Set-Content -Path $npxCmd -Value $wrapper -Encoding ASCII
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_node_gyp=$ngBin"
          node $ngBin --version
          npx --version

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.114

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install binaryen (wasm-opt)
        shell: pwsh
        run: |
          $url = "https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-windows.tar.gz"
          $archive = Join-Path $env:RUNNER_TEMP "binaryen.tar.gz"
          $dest = Join-Path $env:RUNNER_TEMP "binaryen"
          Invoke-WebRequest -Uri $url -OutFile $archive
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          tar -xzf $archive -C $dest
          Remove-Item $archive
          $binDir = Join-Path $dest "binaryen-version_124\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $binDir
          & (Join-Path $binDir "wasm-opt.exe") --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package Windows dist
        shell: pwsh
        env:
          TURBO_BUILD_ENVIRONMENT: onprem
          TURBO_BUILD_VARIANT: work
        run: |
          pnpm run build:packages
          pnpm --filter threema-desktop run build
          pnpm --filter threema-desktop run dist

      - name: Upload Windows packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: treslibre-desktop-win32-x64
          path: build/apps/desktop/packaged/Treslibre-win32-x64

  dist-linux:
    name: Linux Dist (work-onprem)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [debrand-audit, lint-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/libthreema-wasm/libs/libthreema
            apps/desktop/src/rust/launcher

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.114

      - name: Install binaryen (wasm-opt)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-x86_64-linux.tar.gz -o /tmp/binaryen.tar.gz
          sudo mkdir -p /usr/local/binaryen
          sudo tar -xzf /tmp/binaryen.tar.gz -C /usr/local/binaryen --strip-components=1
          rm /tmp/binaryen.tar.gz
          echo "/usr/local/binaryen/bin" >> "$GITHUB_PATH"
          /usr/local/binaryen/bin/wasm-opt --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package Linux dist
        run: |
          pnpm run build:packages
          pnpm run build:desktop:work-onprem
          pnpm run dist:desktop:work-onprem

      - name: Archive Linux package
        run: |
          tar -czf build/apps/desktop/packaged/Treslibre-linux-x64.tar.gz \
            -C build/apps/desktop/packaged Treslibre-linux-x64

      - name: Upload Linux packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: treslibre-desktop-linux-x64
          path: build/apps/desktop/packaged/Treslibre-linux-x64.tar.gz

  dist-macos:
    name: macOS Dist (work-onprem, arm64)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [debrand-audit, lint-build-test]
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94'
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/libthreema-wasm/libs/libthreema
            apps/desktop/src/rust/launcher
            apps/desktop/src/rust/helper

      - name: Install wasm-bindgen-cli
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.114

      - name: Install binaryen (wasm-opt)
        run: |
          if curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_124/binaryen-version_124-arm64-macos.tar.gz -o /tmp/binaryen.tar.gz; then
            mkdir -p "$RUNNER_TEMP/binaryen"
            tar -xzf /tmp/binaryen.tar.gz -C "$RUNNER_TEMP/binaryen" --strip-components=1
            rm /tmp/binaryen.tar.gz
            echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/binaryen/bin/wasm-opt" --version
          else
            brew install binaryen
            wasm-opt --version
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package macOS dist
        run: |
          pnpm run build:packages
          pnpm run build:desktop:work-onprem
          pnpm run dist:desktop:work-onprem

      - name: Archive macOS package
        run: |
          tar -czf build/apps/desktop/packaged/Treslibre-darwin-arm64.tar.gz \
            -C build/apps/desktop/packaged Treslibre-darwin-arm64

      - name: Upload macOS packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: treslibre-desktop-darwin-arm64
          path: build/apps/desktop/packaged/Treslibre-darwin-arm64.tar.gz
